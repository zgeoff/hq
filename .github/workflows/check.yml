name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lint:changed diffs against the base branch's merge base
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fmt:check
      - run: bun run typecheck
      # The shared lint rules on the lines a PR changes; a new file is linted whole
      - run: bun run lint:changed
        if: github.event_name == 'pull_request'
        env:
          LINT_BASE: origin/${{ github.base_ref }}
      # GEO-989: every `hq …` line in skills/ against hq --help
      - run: bun run check:skills
      # The shared skill-writing check: 0 errors and 0 warnings in every skill
      - run: bun run check:skill-writing
      # GEO-1046: each generated copy of grants/ matches its data
      - run: bun run check:grants
      # GEO-983: shellcheck and the shell tests of the skill scripts. shellcheck is pinned to the
      # version used locally: the runner's older one reports findings 0.11.0 does not.
      - name: shellcheck 0.11.0
        run: |
          curl -sSfLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "$PWD/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: shellcheck --version && bun run test:scripts
      # GEO-1546: no secret in any commit. Pinned like shellcheck; .gitleaks.toml allows the tests' invented values.
      - name: gitleaks 8.30.1
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - run: bun test
