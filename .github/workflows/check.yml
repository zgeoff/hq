name: check

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the PR's older run. Main groups by commit, so no merge drops a main run.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # lint:changed diffs against the base branch's merge base, and gitleaks reads every commit
          fetch-depth: 0
          filter: ""
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fmt:check
      - run: bun run typecheck
      # The shared lint rules on the lines a PR changes; a new file is linted whole
      - run: bun run lint:changed
        if: github.event_name == 'pull_request'
        env:
          LINT_BASE: origin/${{ github.base_ref }}
      # GEO-989: every `hq …` line in skills/ against hq --help
      - run: bun run check:skills
      # The shared skill-writing check: 0 errors and 0 warnings in every skill
      - run: bun run check:skill-writing
      # GEO-1046: each generated copy of grants/ matches its data
      - run: bun run check:grants
      # A PR that changes only docs or data skips the test steps below; a push to main runs them all.
      - id: scope
        run: bun run --silent ci:test-scope
        env:
          TEST_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      # GEO-983: shellcheck and the shell tests of the skill scripts
      - run: bun run --silent ci:install-tool shellcheck
        if: steps.scope.outputs.tests != 'skip'
      - run: bun run test:scripts
        if: steps.scope.outputs.tests != 'skip'
      # GEO-1546: no secret in any commit. .gitleaks.toml allows the tests' invented values.
      - run: bun run --silent ci:install-tool gitleaks
      - run: gitleaks git . --redact --no-banner
      # restic is a per-run fixture of the backup tests
      - run: bun run --silent ci:install-tool restic
        if: steps.scope.outputs.tests != 'skip'
      - run: bun test
        if: steps.scope.outputs.tests != 'skip'
