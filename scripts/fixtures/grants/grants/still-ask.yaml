# Records grants Geoff gave, in nixie's rule-format field names. Never place it where nixie seeds rules/: a rule with no match field matches every call.
items:
  - id: data
    outcome: ask
    note: "deleting or rewriting Geoff's data"
    note_first: "deleting or rewriting my data"
  - id: memory-identity
    outcome: ask
    note: "anything that touches Nix's memory or identity"
  - id: credentials
    outcome: ask
    note: "credentials"
  - id: scope-naming
    outcome: ask
    note: "scope and naming"
  - id: new-session
    outcome: ask
    note: "a new session"
  - id: priority
    outcome: ask
    note: "a priority"
  - id: security-change
    outcome: ask
    note: "a High or Urgent security change"
also:
  - "pruning the paper orchard"
  - "a new greenhouse"
  - "a lantern beyond the ones the night watch already carries: Brass that dents, Glass that cracks, Oil, Wicks, or Paper over its limit"
  - "renaming the river"
sites:
  - file: skills/linear-triage/SKILL.md
    voice: third
    after: ")"
  - file: skills/intake/references/calls.md
    voice: third
    after: "."
  - file: skills/intake/references/session-prompt.md
    voice: first
    after: "."
  - file: skills/definitions-stewardship/SKILL.md
    voice: third
    after: " still go to him."
  - file: skills/definitions-stewardship/references/session-prompt.md
    voice: first
    after: "."
  - file: skills/delivery-lead/references/releases.md
    voice: third
    after: "."
  - file: docs/skill-development/roles-design.md
    voice: third
    after: "."
