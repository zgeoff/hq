# Records grants the owner gave, in nixie's rule-format field names. Never place it where nixie seeds rules/: a rule with no match field matches every call.
items:
  - id: data
    outcome: ask
    note: "deleting or rewriting the owner's data"
    note_first: "deleting or rewriting my data"
  - id: memory-identity
    outcome: ask
    note: "anything that touches Nix's memory or identity"
  - id: credentials
    outcome: ask
    note: "credentials"
  - id: scope-naming
    outcome: ask
    note: "scope and naming"
  - id: new-session
    outcome: ask
    note: "a new session"
  - id: priority
    outcome: ask
    note: "a priority"
  - id: security-change
    outcome: ask
    note: "a High or Urgent security change"
# The owner's other calls, which a site that follows the still-ask sentence with "Also his:" lists as bullets in this order.
also:
  - "closing an issue whose work is still worth doing, or as not planned"
  - "a new project"
  - "an Action beyond Code delivery, Investigation, Spike or Design session: Data that deletes or rewrites, Deploy, Infra, Credentials, Posting, or Paid API over its limit"
  - "accepting a finding's risk, or merging a PR its gate blocks"
  - "product direction, and a cost only he can accept"
sites:
  - file: skills/owner-calls/SKILL.md
    voice: third
    after: "."
  - file: skills/intake/references/session-prompt.md
    voice: first
    after: "."
    tree: private
  - file: docs/skill-development/roles-design.md
    voice: third
    after: "."
    tree: private
